        function Poly(x, y, v)
        {
            let n = v.length / 2;
            let d = (x - v[0]) * (x - v[0]) + (y - v[1]) * (y - v[1]);
            let s = 1;
            for (let i = 0, j = n - 1; i < n; j = i, i++)
            {
                let ex = v[j * 2] - v[i * 2], ey = v[j * 2 + 1] - v[i * 2 + 1];
                let wx = x - v[i * 2], wy = y - v[i * 2 + 1];
                let h = Math.max(0, Math.min(1, (wx * ex + wy * ey) / Math.max(1e-9, ex * ex + ey * ey)));
                let bx = wx - ex * h, by = wy - ey * h;
                d = Math.min(d, bx * bx + by * by);
                let c1 = y >= v[i * 2 + 1], c2 = y < v[j * 2 + 1], c3 = ex * wy > ey * wx;
                if ((c1 && c2 && c3) || (!c1 && !c2 && !c3)) s = -s;
            }
            return s * Math.sqrt(d);
        }

        /// <summary>Kuadratik Bezier eğrisini noktalara böler.</summary>
        function Bez(ax, ay, cx, cy, bx, by, n)
        {
            let p = new Array((n + 1) * 2);
            for (let i = 0; i <= n; i++)
            {
                let t = i / n, u = 1 - t;
                p[i * 2] = u * u * ax + 2 * u * t * cx + t * t * bx;
                p[i * 2 + 1] = u * u * ay + 2 * u * t * cy + t * t * by;
            }
            return p;
        }

        function Join(a, b) { return a.concat(b); }

        function Reverse(p)
        {
            let n = p.length / 2;
            let r = new Array(p.length);
            for (let i = 0; i < n; i++) { r[i * 2] = p[(n - 1 - i) * 2]; r[i * 2 + 1] = p[(n - 1 - i) * 2 + 1]; }
            return r;
        }

        /// <summary>Çoklu nokta çizgisine uzaklık − yarı kalınlık (uçlarda incelen fırça).</summary>
        function Stroke(x, y, p, w, taper)
        {
            let n = p.length / 2;
            let best = 1e9, bestT = 0;
            for (let i = 0; i + 1 < n; i++)
            {
                let d = Seg(x, y, p[i * 2], p[i * 2 + 1], p[i * 2 + 2], p[i * 2 + 3]);
                if (d < best) { best = d; bestT = (i + 0.5) / (n - 1); }
            }
            let hw = w * 0.5;
            if (taper) hw *= 0.35 + 0.65 * Math.sin(Math.PI * Math.max(0.04, Math.min(0.96, bestT)));
            return best - hw;
        }

        function Bounds(p, pad) {
            let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
            for (let i = 0; i < p.length; i += 2)
            {
                x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]);
                y0 = Math.min(y0, p[i + 1]); y1 = Math.max(y1, p[i + 1]);
            }
            x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
            return [x0, y0, x1, y1];
        }

        // ------------------------------------------------------------------ çizim

        function Build(cv, lk, mood, bgHex)
        {
            let male = lk.Gender == "m";
            let old = lk.Age >= 55;
            let skin = Pick(SkinHex, lk.Skin);
            let skinShade = skin.Mul(0.86);
            let skinDeep = skin.Mul(0.74);
            let hair = Pick(HairHex, old && lk.HairColor < 6 ? 7 : lk.HairColor);
            let hairDark = hair.Mul(0.78);
            let hairLight = hair.Mix(new C(1, 1, 1), 0.22);
            let outfit = Pick(OutfitHex, lk.Outfit);
            let outfitShade = outfit.Mul(0.82);
            let ink = new C(0.16, 0.11, 0.10);

            // Arka plan: köşeleri yuvarlak kart, yukarıdan aşağı hafif ışık
            if (bgHex != null)
            {
                let bg = Hex(bgHex);
                cv.AddGrad((x, y) => Box(x, y, 0.5, 0.5, 0.5, 0.5, 0.16), bg.Mix(new C(1, 1, 1), 0.18), bg.Mul(0.9), (x, y) => y, 0, 0, 1, 1);
                cv.AddFixed((x, y) => Circle(x, y, 0.5, 0.42, 0.36), new C(1, 1, 1, 0.10), 0.1, 0.05, 0.9, 0.8);
            }

            let jaw = male ? 0.128 : 0.112;
            let face = (x, y) => SmoothUnion(Ellipse(x, y, 0.5, 0.385, 0.162, 0.19), Ellipse(x, y, 0.5, 0.468, jaw, 0.118), 0.05);

            // 1) Arka saç
            BackHair(cv, lk, hair, hairDark);

            // 2) Gövde ve boyun
            let body = (x, y) => SmoothUnion(Ellipse(x, y, 0.5, 1.02, male ? 0.39 : 0.35, 0.31), Box(x, y, 0.5, 0.9, 0.2, 0.12, 0.06), 0.04);
            cv.Add(body, outfit, 0.05, 0.66, 0.95, 1.1);
            cv.Add((x, y) => Sub(body(x, y), body(x + 0.045, y + 0.01)), outfitShade, 0.05, 0.66, 0.95, 1.1);
            let neck = (x, y) => Box(x, y, 0.5, 0.62, male ? 0.062 : 0.052, 0.09, 0.03);
            cv.Add(neck, skinShade, 0.4, 0.5, 0.6, 0.73);
            // Boyunda çene gölgesi
            cv.Add((x, y) => Inter(neck(x, y), Ellipse(x, y, 0.5, 0.56, 0.09, 0.05)), skinDeep.A(0.55), 0.4, 0.5, 0.6, 0.62);
            // Yaka: tek sayılı kıyafetlerde V yaka gömlek, çiftlerde bisiklet yaka
            if (lk.Outfit % 2 == 1)
            {
                let v = [ 0.44, 0.685, 0.56, 0.685, 0.5, 0.79 ];
                cv.Add((x, y) => Poly(x, y, v), skinShade, 0.43, 0.68, 0.57, 0.8);
                let lapL = [ 0.44, 0.68, 0.5, 0.795, 0.42, 0.76, 0.385, 0.70 ];
                let lapR = [ 0.56, 0.68, 0.5, 0.795, 0.58, 0.76, 0.615, 0.70 ];
                let collar = outfit.Mix(new C(1, 1, 1), 0.35);
                cv.Add((x, y) => Poly(x, y, lapL), collar, 0.38, 0.67, 0.51, 0.8);
                cv.Add((x, y) => Poly(x, y, lapR), collar, 0.49, 0.67, 0.62, 0.8);
            }
            else
            {
                cv.Add((x, y) => Inter(Ellipse(x, y, 0.5, 0.69, 0.085, 0.04), -(y - 0.69)), skinShade, 0.41, 0.64, 0.59, 0.74);
                cv.Add((x, y) => Math.abs(Ellipse(x, y, 0.5, 0.69, 0.088, 0.043)) - 0.006 + (y < 0.69 ? 1 : 0), outfitShade, 0.4, 0.68, 0.6, 0.75);
            }

            // 3) Kulaklar ve yüz
            cv.Add((x, y) => Ellipse(x, y, 0.338, 0.415, 0.028, 0.044), skinShade, 0.3, 0.36, 0.37, 0.47);
            cv.Add((x, y) => Ellipse(x, y, 0.662, 0.415, 0.028, 0.044), skinShade, 0.63, 0.36, 0.7, 0.47);
            cv.Add(face, skin, 0.32, 0.18, 0.68, 0.6);
            // Yandan gölge (hilal): yüz eksi kaydırılmış yüz
            cv.Add((x, y) => Sub(face(x, y), face(x + 0.028, y + 0.01)), skinShade.A(0.9), 0.32, 0.18, 0.68, 0.6);
            // Yanak ışığı
            cv.Add((x, y) => Ellipse(x, y, 0.43, 0.36, 0.06, 0.05), new C(1, 1, 1, 0.07), 0.36, 0.3, 0.5, 0.42);

            // 4) Yüz çizgileri (yaş)
            if (old)
            {
                let l1 = Bez(0.438, 0.462, 0.425, 0.49, 0.44, 0.515, 8);
                let l2 = Bez(0.562, 0.462, 0.575, 0.49, 0.56, 0.515, 8);
                cv.Add((x, y) => Stroke(x, y, l1, 0.005, true), skinDeep.A(0.55), 0.41, 0.45, 0.46, 0.53);
                cv.Add((x, y) => Stroke(x, y, l2, 0.005, true), skinDeep.A(0.55), 0.54, 0.45, 0.59, 0.53);
                let f1 = Bez(0.36, 0.395, 0.35, 0.405, 0.355, 0.418, 5);
                let f2 = Bez(0.64, 0.395, 0.65, 0.405, 0.645, 0.418, 5);
                cv.Add((x, y) => Stroke(x, y, f1, 0.004, true), skinDeep.A(0.5), 0.34, 0.38, 0.37, 0.43);
                cv.Add((x, y) => Stroke(x, y, f2, 0.004, true), skinDeep.A(0.5), 0.63, 0.38, 0.66, 0.43);
            }

            // 5) Sakal (yüzün altında kalan kısmı)
            if (male && lk.Beard > 0) Beard(cv, lk.Beard, face, hair, hairDark);

            // 6) Yanak kızarıklığı
            let blush = mood == Mood.Shy ? 0.5 : mood == Mood.Happy ? 0.3 : 0.14;
            let rose = new C(0.93, 0.45, 0.45, blush);
            cv.Add((x, y) => Ellipse(x, y, 0.405, 0.468, 0.038, 0.022), rose, 0.36, 0.44, 0.45, 0.5);
            cv.Add((x, y) => Ellipse(x, y, 0.595, 0.468, 0.038, 0.022), rose, 0.55, 0.44, 0.64, 0.5);

            // 7) Gözler, kaşlar, burun, ağız
            let iris = Pick(EyeHex, lk.Eyes);
            Eye(cv, mood, -1, iris, ink, male);
            Eye(cv, mood, 1, iris, ink, male);
            Brow(cv, mood, -1, hairDark.Mix(ink, 0.25), male);
            Brow(cv, mood, 1, hairDark.Mix(ink, 0.25), male);
            let nose = Bez(0.502, 0.425, 0.488, 0.465, 0.506, 0.47, 8);
            cv.Add((x, y) => Stroke(x, y, nose, 0.007, true), skinDeep.A(0.75), 0.47, 0.41, 0.53, 0.49);
            cv.Add((x, y) => Ellipse(x, y, 0.5, 0.475, 0.022, 0.008), skinDeep.A(0.25), 0.47, 0.46, 0.53, 0.49);
            Mouth(cv, mood, male, skin, ink, lk.Beard > 0);

            // 8) Ön saç
            FrontHair(cv, lk, hair, hairDark, hairLight, face);

            // 9) Gözlük
            if (lk.Glasses > 0) Glasses(cv, lk.Glasses);
        }

        // ------------------------------------------------------------------ yüz parçaları

        function Eye(cv, mood, side, iris, ink, male)
        {
            let cx = 0.5 + side * 0.069, cy = 0.405;
            let w = 0.037, h = 0.022;
            let inner = cx - side * w, outer = cx + side * w;
            // Üst ve alt kapak eğrileri (iç köşe → dış köşe)
            let topLift = 0, outerDrop = 0, innerDrop = 0, bottomLift = 0, open = 1;
            let lookX = 0, lookY = 0;
            switch (mood)
            {
                case Mood.Happy: bottomLift = 0.016; open = 0.95; break;
                case Mood.Sad: outerDrop = 0.012; open = 0.75; lookY = 0.004; break;
                case Mood.Angry: innerDrop = 0.012; open = 0.8; break;
                case Mood.Surprised: topLift = 0.008; open = 1.25; break;
                case Mood.Shy: open = 0.7; lookX = -side * 0.0 + 0.008; lookY = 0.007; bottomLift = 0.006; break;
                case Mood.Worried: outerDrop = 0.006; topLift = 0.003; open = 0.95; lookX = -0.006; break;
            }
            let topY = cy - h * open - topLift;
            let top = Bez(inner, cy + innerDrop * 0.6, cx, topY - 0.012 * open + (innerDrop + outerDrop) * 0.5, outer, cy + outerDrop * 0.3, 12);
            let bottom = Bez(outer, cy + outerDrop * 0.3, cx, cy + h * 1.05 - bottomLift * 1.6, inner, cy + innerDrop * 0.6, 12);
            let shape = Join(top, bottom);
            let [x0, y0, x1, y1] = Bounds(shape, 0.01);
            let opening = (x, y) => Poly(x, y, shape);
            cv.Add(opening, new C(0.98, 0.97, 0.95), x0, y0, x1, y1);
            let ix = cx + lookX + side * 0.002, iy = cy + 0.002 + lookY;
            let ir = 0.0165;
            cv.Add((x, y) => Inter(Circle(x, y, ix, iy, ir), opening(x, y)), iris, x0, y0, x1, y1);
            cv.Add((x, y) => Inter(Circle(x, y, ix, iy + 0.004, ir * 0.72), opening(x, y)), iris.Mul(0.75).A(0.5), x0, y0, x1, y1);
            cv.Add((x, y) => Inter(Circle(x, y, ix, iy, 0.0078), opening(x, y)), new C(0.08, 0.06, 0.06), x0, y0, x1, y1);
            cv.Add((x, y) => Inter(Circle(x, y, ix + 0.006, iy - 0.007, 0.0042), opening(x, y)), new C(1, 1, 1, 0.95), x0, y0, x1, y1);
            // Üst kapak gölgesi ve çizgisi (kirpik)
            cv.Add((x, y) => Inter(opening(x, y), Stroke(x, y, top, 0.012, false)), new C(0, 0, 0, 0.12), x0, y0, x1, y1);
            let lash = male ? 0.0075 : 0.0105;
            cv.Add((x, y) => Stroke(x, y, top, lash, true), ink, x0 - 0.01, y0 - 0.01, x1 + 0.01, y1);
            if (!male)
            {
                // Dış köşede küçük kirpik kıvrımı
                let tip = Bez(outer, cy + outerDrop * 0.3, outer + side * 0.008, cy - 0.006, outer + side * 0.013, cy - 0.011, 4);
                cv.Add((x, y) => Stroke(x, y, tip, 0.006, true), ink, Math.min(outer, outer + side * 0.02) - 0.01, cy - 0.025, Math.max(outer, outer + side * 0.02) + 0.01, cy + 0.01);
            }
            // Alt kapak (ince)
            cv.Add((x, y) => Stroke(x, y, bottom, 0.003, true), ink.A(0.35), x0, y0, x1, y1 + 0.01);
        }

        function Brow(cv, mood, side, col, male)
        {
            let cx = 0.5 + side * 0.07, cy = 0.352;
            let innerY = 0, outerY = 0, arch = 0.01, lift = 0;
            switch (mood)
            {
                case Mood.Happy: lift = 0.006; arch = 0.013; break;
                case Mood.Sad: innerY = -0.014; outerY = 0.006; arch = 0.004; break;
                case Mood.Angry: innerY = 0.014; outerY = -0.008; arch = 0.002; break;
                case Mood.Surprised: lift = 0.02; arch = 0.016; break;
                case Mood.Shy: innerY = -0.006; lift = 0.002; break;
                case Mood.Worried: innerY = -0.012; outerY = 0.002; arch = 0.006; break;
            }
            let ix = cx - side * 0.038, ox = cx + side * 0.042;
            let p = Bez(ix, cy + innerY - lift, cx + side * 0.004, cy - arch - lift, ox, cy + 0.008 + outerY - lift, 10);
            let w = male ? 0.017 : 0.011;
            let [x0, y0, x1, y1] = Bounds(p, 0.02);
            cv.Add((x, y) => Stroke(x, y, p, w, true), col, x0, y0, x1, y1);
        }

        function Mouth(cv, mood, male, skin, ink, beard)
        {
            let cx = 0.5, cy = 0.516;
            let lip = male ? skin.Mul(0.72).Mix(new C(0.6, 0.3, 0.3), 0.25) : new C(0.80, 0.38, 0.40);
            let dark = new C(0.36, 0.12, 0.14);
            switch (mood)
            {
                case Mood.Happy:
                    {
                        let top = Bez(cx - 0.05, cy - 0.006, cx, cy + 0.004, cx + 0.05, cy - 0.006, 10);
                        let bot = Bez(cx + 0.05, cy - 0.006, cx, cy + 0.058, cx - 0.05, cy - 0.006, 12);
                        let shape = Join(top, bot);
                        let m = (x, y) => Poly(x, y, shape);
                        cv.Add(m, dark, cx - 0.06, cy - 0.02, cx + 0.06, cy + 0.05);
                        cv.Add((x, y) => Inter(m(x, y), Ellipse(x, y, cx, cy - 0.004, 0.045, 0.011)), new C(1, 1, 1, 0.95), cx - 0.06, cy - 0.02, cx + 0.06, cy + 0.02);
                        cv.Add((x, y) => Inter(m(x, y), Ellipse(x, y, cx, cy + 0.036, 0.026, 0.012)), new C(0.86, 0.42, 0.45), cx - 0.04, cy + 0.01, cx + 0.04, cy + 0.05);
                        let corners = Bez(cx - 0.056, cy - 0.012, cx - 0.052, cy - 0.004, cx - 0.048, cy - 0.004, 3);
                        cv.Add((x, y) => Stroke(x, y, corners, 0.004, false), ink.A(0.4), cx - 0.07, cy - 0.03, cx - 0.03, cy + 0.01);
                        let corners2 = Bez(cx + 0.056, cy - 0.012, cx + 0.052, cy - 0.004, cx + 0.048, cy - 0.004, 3);
                        cv.Add((x, y) => Stroke(x, y, corners2, 0.004, false), ink.A(0.4), cx + 0.03, cy - 0.03, cx + 0.07, cy + 0.01);
                        break;
                    }
                case Mood.Surprised:
                    cv.Add((x, y) => Ellipse(x, y, cx, cy + 0.01, 0.019, 0.024), dark, cx - 0.03, cy - 0.03, cx + 0.03, cy + 0.05);
                    cv.Add((x, y) => Math.abs(Ellipse(x, y, cx, cy + 0.01, 0.021, 0.026)) - 0.004, lip, cx - 0.035, cy - 0.03, cx + 0.035, cy + 0.05);
                    break;
                default:
                    {
                        let curve, width = 0.04, yOff = 0;
                        switch (mood)
                        {
                            case Mood.Sad: curve = -0.016; width = 0.034; yOff = 0.006; break;
                            case Mood.Angry: curve = -0.008; width = 0.036; break;
                            case Mood.Shy: curve = 0.012; width = 0.026; break;
                            case Mood.Worried: curve = -0.004; width = 0.03; break;
                            default: curve = 0.008; break;
                        }
                        let line = Bez(cx - width, cy + yOff - curve * 0.2, cx, cy + yOff + curve, cx + width, cy + yOff - curve * 0.2, 12);
                        if (mood == Mood.Worried) line = [ cx - width, cy + 0.004, cx - width * 0.35, cy - 0.003, cx + width * 0.3, cy + 0.004, cx + width, cy - 0.002 ];
                        if (!male)
                        {
                            // Dudak: üst ve alt ince dolgu
                            let lower = Bez(cx - width * 0.8, cy + yOff + 0.002, cx, cy + yOff + curve + 0.03, cx + width * 0.8, cy + yOff + 0.002, 10);
                            let lowerShape = Join(lower, Reverse(Bez(cx - width * 0.8, cy + yOff + 0.002, cx, cy + yOff + curve + 0.004, cx + width * 0.8, cy + yOff + 0.002, 8)));
                            cv.Add((x, y) => Poly(x, y, lowerShape), lip.A(0.85), cx - 0.05, cy - 0.02, cx + 0.05, cy + 0.05);
                            let upper = Bez(cx - width * 0.9, cy + yOff - curve * 0.2, cx, cy + yOff - 0.02 + curve * 0.5, cx + width * 0.9, cy + yOff - curve * 0.2, 10);
                            let upperShape = Join(upper, Reverse(Bez(cx - width * 0.9, cy + yOff - curve * 0.2, cx, cy + yOff + curve, cx + width * 0.9, cy + yOff - curve * 0.2, 8)));
                            cv.Add((x, y) => Poly(x, y, upperShape), lip.Mul(0.9).A(0.85), cx - 0.05, cy - 0.04, cx + 0.05, cy + 0.03);
                        }
                        else if (!beard)
                        {
                            let under = Bez(cx - 0.018, cy + yOff + 0.018, cx, cy + yOff + 0.024, cx + 0.018, cy + yOff + 0.018, 6);
                            cv.Add((x, y) => Stroke(x, y, under, 0.006, true), lip.A(0.5), cx - 0.03, cy, cx + 0.03, cy + 0.04);
                        }
                        let [lx0, ly0, lx1, ly1] = Bounds(line, 0.01);
                        let ln = line;
                        cv.Add((x, y) => Stroke(x, y, ln, 0.0065, true), dark, lx0, ly0, lx1, ly1);
                        break;
                    }
            }
        }

        function Glasses(cv, kind)
        {
            let frame = new C(0.13, 0.12, 0.13);
            for (let s = -1; s <= 1; s += 2)
            {
                let cx = 0.5 + s * 0.07, cy = 0.407;
                let lens;
                if (kind == 1) { let r = 0.05; lens = (x, y) => Circle(x, y, cx, cy, r); }
                else lens = (x, y) => Box(x, y, cx, cy, 0.056, 0.037, 0.014);
                let ln = lens;
                cv.Add(ln, new C(1, 1, 1, 0.12), cx - 0.07, cy - 0.06, cx + 0.07, cy + 0.06);
                cv.Add((x, y) => Math.abs(ln(x, y)) - 0.0045, frame, cx - 0.07, cy - 0.06, cx + 0.07, cy + 0.06);
                let ex = cx + s * (kind == 1 ? 0.05 : 0.056);
                cv.Add((x, y) => Seg(x, y, ex, cy - 0.006, 0.5 + s * 0.162, cy - 0.012) - 0.004, frame, Math.min(ex, 0.5 + s * 0.17) - 0.01, cy - 0.03, Math.max(ex, 0.5 + s * 0.17) + 0.01, cy + 0.01);
            }
            let bridge = Bez(0.5 - 0.02, 0.40, 0.5, 0.392, 0.5 + 0.02, 0.40, 6);
            cv.Add((x, y) => Stroke(x, y, bridge, 0.008, false), frame, 0.47, 0.38, 0.53, 0.42);
        }

        function Beard(cv, kind, face, hair, hairDark)
        {
            // Ağız çevresi hariç alt yüz
            let lower = (x, y) => Inter(face(x, y), -(y - (0.455 + Math.abs(x - 0.5) * 0.25)));
            let mouthHole = (x, y) => Ellipse(x, y, 0.5, 0.518, 0.042, 0.013);
            if (kind == 1)
            {
                cv.Add((x, y) => Sub(lower(x, y), mouthHole(x, y)), hairDark.A(0.28), 0.32, 0.4, 0.68, 0.62);
                return;
            }
            if (kind == 2)
            {
                let full = (x, y) => SmoothUnion(Inter(face(x, y) - 0.008, -(y - (0.45 + Math.abs(x - 0.5) * 0.35))), Ellipse(x, y, 0.5, 0.575, 0.07, 0.04), 0.04);
                cv.Add((x, y) => Sub(full(x, y), mouthHole(x, y)), hair.A(0.92), 0.3, 0.4, 0.7, 0.65);
                cv.Add((x, y) => Sub(Inter(full(x, y), Ellipse(x, y, 0.53, 0.55, 0.12, 0.07)), mouthHole(x, y)), hairDark.A(0.5), 0.4, 0.47, 0.66, 0.65);
            }
            // Bıyık (2 ve 3)
            let mL = [ 0.5, 0.49, 0.455, 0.493, 0.438, 0.51, 0.452, 0.507, 0.5, 0.5 ];
            let mR = [ 0.5, 0.49, 0.545, 0.493, 0.562, 0.51, 0.548, 0.507, 0.5, 0.5 ];

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function scoreQuiz(answers) {
  const sum = { energy: 0, support: 0, plan: 0, rhythm: 0, open: 0, direct: 0 };
  let value = "dürüstlük";
  answers.forEach((ai, qi) => {
    const q = QUIZ[qi];
    if (ai == null || !q) return;
    if (q.value) { value = q.o[ai][1]; return; }
    const d = q.o[ai][1];
    for (const k in d) sum[k] += d[k];
  });
  const axes = {};
  for (const k in sum) axes[k] = clamp(sum[k] / 5, -1, 1);
  return { axes, value, archetype: archetypeOf(axes) };
}

function archetypeOf(ax) {
  return (ax.energy >= 0 ? "d" : "i") + (ax.support >= 0 ? "l" : "s") + (ax.plan >= 0 ? "p" : "s");
}

function distanceKm(a, b) {
  const A = DISTRICTS[a] || DISTRICTS.Kemer, B = DISTRICTS[b] || DISTRICTS.Kemer;
  const dy = (A[0] - B[0]) * 111, dx = (A[1] - B[1]) * 111 * Math.cos(A[0] * Math.PI / 180);
  return Math.sqrt(dx * dx + dy * dy);
}

// Tohumlu rastgele (sahte kullanıcılar her açılışta aynı olsun)
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function makeUsers() {
  const r = rng(20261118);
  const pick = a => a[Math.floor(r() * a.length)];
  const users = [];
  const dnames = Object.keys(DISTRICTS);
  for (let i = 0; i < 36; i++) {
    const g = i % 2 === 0 ? "f" : "m";
    const name = (g === "f" ? F_NAMES : M_NAMES)[Math.floor(i / 2) % 16];
    const ax = {};
    for (const a of AXES) ax[a.id] = Math.round((r() * 2 - 1) * 100) / 100;
    const ints = [];
    while (ints.length < 4) { const x = pick(INTERESTS); if (!ints.includes(x)) ints.push(x); }
    const look = { Gender: g, Skin: Math.floor(r() * 6), Hair: Math.floor(r() * 5), HairColor: Math.floor(r() * 7), Eyes: Math.floor(r() * 5), Outfit: Math.floor(r() * 8), Glasses: r() < 0.25 ? 1 + Math.floor(r() * 2) : 0, Beard: g === "m" && r() < 0.45 ? 1 + Math.floor(r() * 3) : 0, Age: 25 };
    const age = 20 + Math.floor(r() * 26);
    users.push({
      id: "u" + i, name, gender: g, age, district: pick(dnames), jitter: r() * 1.5,
      axes: ax, archetype: archetypeOf(ax), value: pick(Object.keys(VALUES)), interests: ints, look,
      bio: BIO_BITS[ints[0]] + ".",
      onlySame: g === "f" && r() < 0.3, // bazı kadınlar yalnızca kadınlarla tanışmak istiyor
      verified: r() < 0.7,
    });
  }
  // Takma adlar: ayrı bir tohumla, böylece diğer özellikler değişmez.
  const nr = rng(7071);
  const WORDS = ["Martı", "Dalga", "Yıldız", "Zeytin", "Rüzgar", "Gezgin", "Kahve", "Sahil", "Poyraz", "Lodos", "Mercan", "Çınar", "Kekik", "Lavanta", "Bulut", "Kumsal"];
  const used = new Set();
  for (const u of users) {
    let nick;
    do {
      const w = WORDS[Math.floor(nr() * WORDS.length)], k = Math.floor(nr() * 3), n = 10 + Math.floor(nr() * 89);
      nick = k === 0 ? w + n : k === 1 ? u.name.toLocaleLowerCase("tr") + "." + w.toLocaleLowerCase("tr") : w.toLocaleLowerCase("tr") + "_" + u.name;
    } while (used.has(nick));
    used.add(nick); u.name = nick;
  }
  return users;
}

/** Arkadaşlık uyumu (0..100) ve gerekçeler. */
function compat(me, u) {
  const sim = k => 1 - Math.abs(me.axes[k] - u.axes[k]) / 2;
  const shared = u.interests.filter(x => me.interests.includes(x));
  const parts = [
    { w: 0.2, v: sim("energy"), k: "energy" },
    { w: 0.15, v: sim("rhythm"), k: "rhythm" },
    { w: 0.1, v: sim("plan"), k: "plan" },
    { w: 0.1, v: sim("open"), k: "open" },
    { w: 0.1, v: 1 - Math.abs(me.axes.support - u.axes.support) / 4, k: "support" },
    { w: 0.05, v: sim("direct"), k: "direct" },
    { w: 0.22, v: Math.min(1, shared.length / 3), k: "shared" },
    { w: 0.08, v: me.value === u.value ? 1 : 0.3, k: "value" },
  ];
  let s = 0;
  for (const p of parts) s += p.w * p.v;
  const score = Math.round(clamp(50 + (s - 0.45) * 120, 45, 98));
  // Gerekçeler
  const reasons = [];
  const A = me.axes, B = u.axes;
  if (shared.length) reasons.push({ w: 3 + shared.length, k: "shared", p: shared.slice(0, 3) });
  if (A.rhythm > 0.25 && B.rhythm > 0.25) reasons.push({ w: 3, k: "morning" });
  if (A.rhythm < -0.25 && B.rhythm < -0.25) reasons.push({ w: 3, k: "night" });
  if (A.energy < -0.2 && B.energy < -0.2) reasons.push({ w: 3, k: "calm" });
  if (A.energy > 0.2 && B.energy > 0.2) reasons.push({ w: 3, k: "crowd" });
  if (A.support > 0.2 && B.support > 0.2) reasons.push({ w: 2, k: "listen" });
  if (A.support > 0.2 && B.support < -0.2) reasons.push({ w: 2, k: "ls" });
  if (A.support < -0.2 && B.support > 0.2) reasons.push({ w: 2, k: "sl" });
  if (A.plan > 0.3 && B.plan > 0.3) reasons.push({ w: 2, k: "plan" });
  if (A.plan < -0.3 && B.plan < -0.3) reasons.push({ w: 2, k: "spont" });
  if (A.open > 0.3 && B.open > 0.3) reasons.push({ w: 2, k: "open" });
  if (me.value === u.value) reasons.push({ w: 2.5, k: "value", p: me.value });
  reasons.sort((a, b) => b.w - a.w);
  return { score, reasons: reasons.slice(0, 3), shared };
}

/** Telefon konumundan en yakın semt */
function nearestDistrict(lat, lon) {
  let best = "Kemer", bd = 1e9;
  for (const k in DISTRICTS) {
    const [a, b] = DISTRICTS[k];
    const dy = (a - lat) * 111, dx = (b - lon) * 111 * Math.cos(lat * Math.PI / 180), dd = dx * dx + dy * dy;
    if (dd < bd) { bd = dd; best = k; }
  }
  return best;
}

/** Mesafe (km). Konum kapalıysa null. */
function userDistance(me, u) {
  if (!me.loc) return null;
  const B = DISTRICTS[u.district];
  const dy = (me.loc.lat - B[0]) * 111, dx = (me.loc.lon - B[1]) * 111 * Math.cos(me.loc.lat * Math.PI / 180);
  return Math.max(0.5, Math.round((Math.sqrt(dx * dx + dy * dy) + u.jitter) * 2) / 2);
}

/** Bugünün önerileri: filtrelere uyan, daha önce görülmemiş, en uyumlu 3 kişi (biraz rastgelelikle). */
function pickDaily(me, users, seen, day) {
  const r = rng(1000 + day * 7919);
  const pool = users.filter(u => {
    if (seen[u.id]) return false;
    if (me.prefs.gender !== "all" && u.gender !== me.prefs.gender) return false;
    if (u.onlySame && me.gender !== u.gender) return false;
    if (u.age < me.prefs.ageMin || u.age > me.prefs.ageMax) return false;
    const dist = userDistance(me, u);
    if (dist != null && dist > me.prefs.maxKm) return false;
    return true;
  }).map(u => ({ u, s: compat(me, u).score + r() * 12 }));
  pool.sort((a, b) => b.s - a.s);
  return pool.slice(0, 3).map(x => x.u.id);
}

let PLAYER_G = "";   // oyuncunun cinsiyeti: Rusçada fiil ve sıfat sonları buna göre seçilir

/** Rusça "(а)" gibi iki biçimli yazımları cinsiyete göre tek biçime indirir. Cinsiyet bilinmiyorsa olduğu gibi bırakır. */
function ruG(s, g) {
  if (LANG !== "ru" || (g !== "f" && g !== "m")) return s;
  const f = g === "f";
  return s.replace(/(\S+?)ый\(ая\)/g, f ? "$1ая" : "$1ый")
          .replace(/(\S+?)ся\(ась\)/g, f ? "$1ась" : "$1ся")
          .replace(/(\S+?)ен\(на\)/g, f ? "$1на" : "$1ен")
          .replace(/\(а\)/g, f ? "а" : "");
}

function t(key, ...a) {
  let s = (STR[LANG] && STR[LANG][key]) || STR.tr[key] || key;
  s = ruG(s, PLAYER_G);
  a.forEach((v, i) => { s = s.split("{" + i + "}").join(v); });
  return s;
}

  function weekTable() {

    const r = rng(9000 + week);
    const ids = [];
    while (ids.length < Math.min(4, pool.length)) { const x = pool[Math.floor(r() * pool.length)].u.id; if (!ids.includes(x)) ids.push(x); }

    else if (st === "match") actions = `<button class="btn primary" data-act="open-chat" data-v="${u.id}">${t("go_chat")}</button>`;

  function Chats() {
    const ms = Object.keys(S.matches);
    const pend = Object.keys(S.seen).filter(id => S.seen[id] === "pending");
    let h = `<header class="top"><h2>${t("chats")}</h2></header>`;
    if (!ms.length && !pend.length) h += `<div class="card"><p>${t("no_matches")}</p></div>`;
    ms.forEach(id => {
      const u = byId(id), m = S.matches[id];
      const last = m.msgs.length ? m.msgs[m.msgs.length - 1].t : (m.stage === "ice" ? t("ice_waiting") : t("start_chat"));
      h += `<button class="row" data-act="open-chat" data-v="${id}"><img src="${avatar(u.look, 1, 96)}"><div><b>${u.name}</b><span class="muted small">${m.closed ? t("closed") : esc(last).slice(0, 60)}</span></div>${m.unread ? "<em>●</em>" : ""}</button>`;
    });
    if (pend.length) {
      h += `<h3 class="sec">${t("waiting")}</h3>`;
      pend.forEach(id => { const u = byId(id); h += `<div class="row dim"><img src="${avatar(u.look, 0, 96)}"><div><b>${u.name}</b><span class="muted small">${t("req_sent")}</span></div></div>`; });
    }
    return h;
  }

  function GrowthCard() {

    const notes = g.done.slice(-5).reverse().map(d => `<div class="hist"><span>${trackOf(d.track).icon} ${esc(trackOf(d.track).tasks[d.i])}</span>${d.note ? `<em>“${esc(d.note)}”</em>` : ""}</div>`).join("");
    return `<div class="card"><h3>${t("your_track")}: ${tr.icon} ${tr.name}</h3><p class="muted small">${t("steps_total", g.done.length)} · ${t("clarity", clarity())}</p>${notes ? `<div class="muted small">${t("notes_t")}</div>${notes}` : ""}</div>`;

    return `<header class="top"><h2>${t("profile")}</h2></header>
      <div class="archcard small"><img class="avmid" src="${avatar(m.look, 1, 200)}">${S.editMe ? `

        <h2>${esc(m.name)}, ${esc(m.age)}</h2><button class="link" data-act="edit-me">${t("edit_profile")}</button>`}<div class="arch">${a.icon} ${a.name}</div><p class="muted">${a.tag}</p></div>

      <div class="card"><h3>${t("who_meet")}</h3>
        <div class="seg">${[["all", t("all")], ["f", t("only_f")], ["m", t("only_m")]].map(([v, l]) => `<button class="${m.prefs.gender === v ? "on" : ""}" data-act="pref-gender" data-v="${v}">${l}</button>`).join("")}</div>
        ${m.loc ? `<label class="lbl">${t("max_km")} <b>${m.prefs.maxKm} ${LANG === "ru" ? "км" : "km"}</b></label><input type="range" min="1" max="40" value="${m.prefs.maxKm}" data-act="pref-km">` : ""}
        <label class="lbl">${t("age_range")} <b>${m.prefs.ageMin}–${m.prefs.ageMax}</b></label>
        <div class="row2"><input type="range" min="18" max="60" value="${m.prefs.ageMin}" data-act="pref-amin"><input type="range" min="18" max="70" value="${m.prefs.ageMax}" data-act="pref-amax"></div>
        <p class="fine">${t("pref_note")}</p></div>
      <div class="card"><h3>${t("safety")}</h3>
        <div class="srow">${t("s_photo")} <span class="muted">${t("s_photo2")}</span></div>
        <div class="srow">${t("s_selfie")} <span class="badge">${t("soon")}</span></div>
        <div class="srow">${t("s_loc")} <span class="muted">${t("s_loc2")}</span></div>
        <div class="srow">${t("s_block")} <span class="muted">${t("s_block2")}</span></div>
        <div class="srow">${t("s_free")} <span class="muted">${t("s_free2")}</span></div></div>
      <button class="btn ghost" data-act="edit-avatar">${t("edit_avatar")}</button>
      <button class="btn ghost" data-act="redo-quiz">${t("redo_quiz")}</button>
      <button class="btn ghost danger" data-act="reset">${t("reset")}</button>
      <p class="fine center">${t("footer")}</p>`;
  }

  // ---------------------------------------------------------------- buz kırıcı
  function Ice() {
    const u = byId(S.ice), m = S.matches[S.ice], ib = iceText(m.ib);
    if (m.mine == null) {
      return `<div class="screen">
        <button class="link" data-act="close-ice">${t("back")}</button>

        <h2 class="center">${t("icebreaker")}</h2>
        <p class="muted center">${t("ice_note")}</p>
        <div class="scene">${esc(ib.q)}</div>
        <div class="opts">${ib.o.map((o, i) => `<button class="opt" data-act="ice-answer" data-v="${i}"><b>${"ABCD"[i]}</b><span>${esc(o)}</span></button>`).join("")}</div>
      </div>`;

      <div class="pair"><img src="${avatar(S.me.look, same ? 1 : 4, 140)}"><span>${same ? "🎉" : "🤔"}</span><img src="${avatar(u.look, same ? 1 : 4, 140)}"></div>
      <h2 class="center">${same ? t("same") : t("diff")}</h2>

      <div class="card"><div class="muted small">${esc(ib.q)}</div>
        <div class="ans"><b>${t("you_c")}:</b> ${esc(ib.o[m.mine])}</div><div class="ans"><b>${u.name}:</b> ${esc(ib.o[m.theirs])}</div></div>
      <button class="btn primary" data-act="ice-done">${t("start_chat")}</button>
    </div>`;

  // ---------------------------------------------------------------- sohbet
  const VENUE_ICONS = ["☕", "🌊", "🛍️"];
  const venue = i => [VENUE_ICONS[i], t("v" + (i + 1)), t("v" + (i + 1) + "d")];

  function Chat() {
    const u = byId(S.chat), m = S.matches[S.chat], a = arch(u.archetype);
    m.unread = false;
    const c = compat(S.me, u);
    const starters = [
      c.shared[0] ? t("st1", lower(tInt(c.shared[0]))) : t("st1b"),
      t("st2", iceText(m.ib).o[m.theirs]),
      t("st3"),
    ];
    const photo = m.theirPhoto ? `<div class="photo"><img src="${avatar(u.look, 1, 280)}"><span>${t("photo_opened", u.name)}</span></div>` : "";
    return `<div class="chat">
      <header class="chead"><button class="link" data-act="close-chat">←</button><img src="${avatar(u.look, 1, 96)}"><div><b>${u.name}</b><div class="muted small">${a.icon} ${a.name}${userDistance(S.me, u) != null ? " · ~" + num(userDistance(S.me, u)) + (LANG === "ru" ? " км" : " km") : ""}</div></div><button class="link" data-act="report">⋯</button></header>
      <div class="msgs">
        <div class="sys">${t("safe_tip")}</div>
        ${photo}
        ${m.msgs.map(x => x.ask ? (m.myPhoto || m.askDone ? "" : `<div class="ask"><div>${esc(t("ph_ask", u.name))}</div><div class="row2"><button class="btn ghost small" data-act="photo-no">${t("ph_no")}</button><button class="btn primary small" data-act="photo-yes">${t("ph_yes")}</button></div></div>`) : x.img ? `<div class="msg me pic"><img src="${x.img}"></div>` : x.sys ? `<div class="sys">${esc(x.t)}</div>` : `<div class="msg ${x.me ? "me" : ""}">${esc(x.t)}</div>`).join("")}
        ${m.typing ? `<div class="msg typing"><i></i><i></i><i></i></div>` : ""}
      </div>
      ${m.closed ? `<div class="closedbar">${t("bye_sys")}</div>` : `${m.msgs.filter(x => x.me).length < 2 ? `<div class="starters">${starters.map(s => `<button data-act="starter" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
      <div class="tools"><button data-act="photo">${m.myPhoto ? t("photo_on") : t("photo_btn")}</button><button data-act="meet">${t("meet_btn")}</button></div>
      <form class="send" data-act="send"><input id="msg" placeholder="${t("msg_ph")}" autocomplete="off"><button class="btn primary small">${t("send")}</button></form>`}
      ${S.sheet === "meet" ? `<div class="sheetbg" data-act="close-sheet"></div><div class="sheet"><h3>${t("where_meet")}</h3><p class="muted small">${t("public_only")}</p>${[0, 1, 2].map(i => { const v = venue(i); return `<button class="row" data-act="venue" data-v="${i}"><span class="vi">${v[0]}</span><div><b>${v[1]}</b><span class="muted small">${v[2]}</span></div></button>`; }).join("")}</div>` : ""}
      ${S.sheet === "report" ? `<div class="sheetbg" data-act="close-sheet"></div><div class="sheet"><h3>${u.name}</h3><button class="row" data-act="block"><span class="vi">🚫</span><div><b>${t("block")}</b><span class="muted small">${t("block2")}</span></div></button><button class="row" data-act="bye"><span class="vi">👋</span><div><b>${t("bye")}</b><span class="muted small">${t("bye2")}</span></div></button><button class="row" data-act="block" data-v="report"><span class="vi">⚠️</span><div><b>${t("report")}</b><span class="muted small">${t("report2")}</span></div></button></div>` : ""}
    </div>`;
  }

  function addMsg(id, text, me) {
    const m = S.matches[id];
    m.msgs.push({ t: text, me });
    if (!me) return;
    const u = byId(id);
    const n = m.msgs.filter(x => !x.me && !x.sys).length;
    m.typing = true;
    save(); render();
    setTimeout(() => {
      m.typing = false;
      if (m.closed || !S.matches[id]) { save(); return render(); }
      m.msgs.push({ t: LANG === "ru" ? fakeReplyRu(u, text, n) : fakeReply(u, text, n), me: false });
      const mine = m.msgs.filter(x => x.me).length;
      if (m.myPhoto && !m.theirPhoto && mine >= 3) { m.theirPhoto = true; m.msgs.push({ sys: true, t: t("photo_them", u.name) }); }
      else if (!m.myPhoto && !m.theirWants && mine >= 2) { m.theirWants = true; m.msgs.push({ ask: true }); }
      if (S.chat !== id) m.unread = true;
      save(); render();
    }, 900 + Math.random() * 900);
  }

  // ---------------------------------------------------------------- olaylar
  function nextDay() {
    S.day++;
    if (S.g && S.g.step >= 7) { S.g.track = TRACK_ORDER[(TRACK_ORDER.indexOf(S.g.track) + 1) % 4]; S.g.step = 0; }
    // Bekleyen istekler: çoğu kabul edilir
    Object.keys(S.seen).forEach(id => {
      if (S.seen[id] !== "pending") return;
      if (Math.random() < 0.7) { makeMatch(id); setTimeout(() => toast(t("accepted", byId(id).name)), 0); }
      else S.seen[id] = "no";
    });
    S.daily = null;
    save(); render();
  }

  function makeMatch(id) {
    S.seen[id] = "match";
    S.matches[id] = { stage: "ice", ib: Math.floor(Math.random() * ICEBREAKERS.length), mine: null, theirs: null, msgs: [], unread: true };
  }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || el.tagName === "FORM" || el.type === "range") return;
    const act = el.dataset.act, v = el.dataset.v;
    const m = S.me;
    switch (act) {
      case "start":
        if (!document.getElementById("adult").checked) return toast(t("need_adult"));
        return go("onboard");
      case "gender": readOnboard(); m.gender = v; if (m.look) m.look.Gender = v; return render();
      case "locate": readOnboard(); return locate();
      case "lang": LANG = S.lang = v; document.documentElement.lang = v; readOnboard(); save(); return render();
      case "interest": readOnboard(); m.interests = m.interests.includes(v) ? m.interests.filter(x => x !== v) : m.interests.concat([v]).slice(-8); return render();
      case "edit-me": S.editMe = { nick: m.name, age: m.age }; return render();
      case "edit-cancel": S.editMe = false; return render();
      case "edit-save": {
        const nick = document.getElementById("p-nick").value, age = +document.getElementById("p-age").value;
        S.editMe = { nick, age: document.getElementById("p-age").value };
        const e = nickErr(nick); if (e) return toast(e);
        if (!(age >= 18 && age <= 99)) return toast(t("need_18"));
        m.name = nick.trim(); m.age = String(age); S.editMe = false; save(); render(); return toast(t("saved"));
      }
      case "onboard-next":
        readOnboard();
        { const e = nickErr(m.name); if (e) return toast(e); }
        m.name = m.name.trim();
        if (!(+m.age >= 18)) return toast(t("need_18"));
        if (!m.gender) return toast(t("need_gender"));
        if (m.interests.length < 3) return toast(t("need_3"));
        if (!S.prefsSet) { m.prefs.ageMin = Math.max(18, +m.age - 8); m.prefs.ageMax = Math.min(70, +m.age + 10); S.prefsSet = true; }
        S.qi = 0; S.quiz = []; return go("quiz");
      case "answer":
        S.quiz[S.qi] = +v;
        if (S.qi < QUIZ.length - 1) { S.qi++; save(); return render(); }
        Object.assign(m, scoreQuiz(S.quiz)); S.daily = null;
        return go("result");
      case "quiz-back": if (S.qi > 0) { S.qi--; render(); } return;
      case "redo-quiz": S.qi = 0; S.quiz = []; return go("quiz");
      case "to-avatar": if (!m.look) m.look = randomLook(m.gender); return go("avatar");
      case "look": m.look[el.dataset.f] = +v; save(); return render();
      case "look-random": m.look = randomLook(m.gender); save(); return render();
      case "finish": case "edit-avatar":
        if (act === "edit-avatar") return go("avatar");
        ensureG(); S.tab = "path"; return go("app");
      case "tab": S.tab = v; save(); return render();
      case "next-day": return nextDay();
      case "pass": S.seen[v] = "no"; save(); return render();
      case "like": {
        const u = byId(v), c = compat(m, u);
        if (c.score >= 72 || Math.random() < 0.45) { makeMatch(v); save(); S.ice = v; toast(t("mutual", u.name)); return; }
        S.seen[v] = "pending"; save(); return toast(t("req_toast"));
      }
      case "open-chat": {
        const mm = S.matches[v];
        if (mm.stage === "ice") { S.ice = v; save(); return render(); }
        S.chat = v; save(); return render();
      }
      case "close-ice": S.ice = null; save(); return render();
      case "ice-answer": {
        const mm = S.matches[S.ice], u = byId(S.ice);
        mm.mine = +v; mm.theirs = theirIcebreakerAnswer(u, ICEBREAKERS[mm.ib]); save(); return render();
      }
      case "ice-done": { const id = S.ice; S.matches[id].stage = "chat"; S.ice = null; S.chat = id; S.tab = "chats"; save(); return render(); }
      case "close-chat": S.chat = null; S.sheet = null; save(); return render();
      case "starter": addMsg(S.chat, v, true); return;
      case "photo": {
        const mm = S.matches[S.chat];
        if (mm.myPhoto) return toast(t("photo_already"));
        if (!(S.me.photos || []).length) return toast(t("photo_none"));
        mm.myPhoto = true; mm.msgs.push({ sys: true, t: t("photo_you") }); mm.msgs.push({ img: S.me.photos[0], me: true });
        if (mm.theirWants || mm.msgs.filter(x => x.me && !x.img).length >= 3) { mm.theirPhoto = true; mm.msgs.push({ sys: true, t: t("photo_them", byId(S.chat).name) }); }
        save(); return render();
      }
      case "meet": S.sheet = "meet"; return render();
      case "report": S.sheet = "report"; return render();
      case "close-sheet": S.sheet = null; return render();
      case "venue": {
        const vn = venue(+v); S.sheet = null;
        S.matches[S.chat].msgs.push({ sys: true, t: t("meet_sys", vn[1]) });
        addMsg(S.chat, t("meet_msg", vn[1]), true);
        return;
      }
      case "bye": {
        const mm = S.matches[S.chat];
        mm.msgs.push({ t: t("bye_msg"), me: true });
        mm.closed = true; S.sheet = null; save(); return render();
      }
      case "dq": {
        const g = ensureG(), q = dailyQ(S.day - 1), eff = q[1][+v][1];
        g.dq[S.day] = +v;
        for (const k in eff) m.axes[k] = Math.max(-1, Math.min(1, Math.round((m.axes[k] + eff[k] * 0.06) * 100) / 100));
        save(); return render();
      }
      case "task-done": {
        const g = ensureG(), was = unlocked(), el = document.getElementById("g-note");
        g.done.push({ day: S.day, track: g.track, i: g.step, note: el ? el.value.trim().slice(0, 140) : "" });
        g.step++; g.lastDay = S.day; save(); render();
        return toast(!was && unlocked() ? t("unlocked_t") : t("task_done"));
      }
      case "unlock-proto": ensureG().unlock = true; save(); render(); return toast(t("unlocked_t"));
      case "tbl-join": S.table.joined = true; save(); render(); return toast(t("tbl_joined"));
      case "tbl-leave": S.table.joined = false; save(); render(); return toast(t("tbl_left"));
      case "block": {
        const id = S.chat, u = byId(id);
        delete S.matches[id]; S.seen[id] = "blocked"; S.chat = null; S.sheet = null; save();
        return toast(v === "report" ? t("reported", u.name) : t("blocked", u.name));
      }
      case "photo-yes": {
        const mm = S.matches[S.chat];
        if (!(S.me.photos || []).length) return toast(t("photo_none"));
        mm.askDone = true; mm.myPhoto = true; mm.theirPhoto = true;
        mm.msgs.push({ img: S.me.photos[0], me: true }); mm.msgs.push({ sys: true, t: t("photo_them", byId(S.chat).name) });
        save(); return render();
      }
      case "photo-no": { const mm = S.matches[S.chat]; mm.askDone = true; mm.msgs.push({ sys: true, t: t("ph_no_done") }); save(); return render(); }
      case "photo-del": S.me.photos.splice(+v, 1); save(); return render();
      case "pref-gender": readOnboard(); m.prefs.gender = v; S.daily = null; save(); return render();
      case "reset":
        if (!S.resetArm) { S.resetArm = true; return toast(t("reset_sure")); }
        { const keep = LANG; S = fresh(); S.lang = keep; } save(); window.scrollTo(0, 0); return render();
    }
  });

  document.addEventListener("input", e => {
    const el = e.target;
    if (el.type !== "range") return;
    const p = S.me.prefs, val = +el.value;
    if (el.dataset.act === "pref-km") p.maxKm = val;
    if (el.dataset.act === "pref-amin") p.ageMin = Math.min(val, p.ageMax);
    if (el.dataset.act === "pref-amax") p.ageMax = Math.max(val, p.ageMin);
    const lbl = el.closest(".card").querySelectorAll(".lbl b");
    if (lbl[0]) lbl[0].textContent = p.maxKm + (LANG === "ru" ? " км" : " km");
    if (lbl[1]) lbl[1].textContent = p.ageMin + "–" + p.ageMax;
    save();
  });

  document.addEventListener("submit", e => {
    e.preventDefault();
    const inp = document.getElementById("msg");
    const t = inp.value.trim();
    if (!t || !S.chat) return;
    addMsg(S.chat, t, true);
  });

  function readOnboard() {
    const n = document.getElementById("f-name"), a = document.getElementById("f-age"), d = document.getElementById("f-district");
    if (n) S.me.name = n.value;
    if (a) S.me.age = a.value;
  }

  // Sohbette "yazıyor" durumu sayfa yenilenince takılı kalmasın
  Object.values(S.matches).forEach(m => { m.typing = false; });
  S.sheet = null;
  S.toast = null;
  render();
})();

</script>
</body>
</html>
